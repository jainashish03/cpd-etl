# render.yaml — Render Blueprint (Infrastructure as Code)
# Deploy: Render Dashboard → New → Blueprint → connect your GitHub repo
#
# Services created:
#   - postgres-cpd          : data warehouse (PostgreSQL)
#   - postgres-airflow      : Airflow metadata DB (PostgreSQL)
#   - postgres-metabase     : Metabase app DB (PostgreSQL)
#   - airflow-webserver     : Airflow UI  (Web Service, custom Docker)
#   - airflow-scheduler     : Airflow scheduler (Background Worker, custom Docker)
#   - metabase              : Metabase BI  (Web Service, public Docker image)
#
# After first deploy:
#   1. Visit the airflow-webserver URL, unpause cpd_daily_police_log, trigger once.
#   2. In Metabase → Add database → PostgreSQL → use host/port from postgres-cpd.
#   3. Build charts from sql/metabase_questions.sql.

databases:
  # ── Data warehouse ───────────────────────────────────────────────────────────
  - name: postgres-cpd
    databaseName: postgres_cpd
    user: cpd
    plan: free

  # ── Airflow metadata DB ──────────────────────────────────────────────────────
  - name: postgres-airflow
    databaseName: airflow
    user: airflow
    plan: free

  # ── Metabase application DB ──────────────────────────────────────────────────
  - name: postgres-metabase
    databaseName: metabase
    user: metabase
    plan: free

services:
  # ── Airflow webserver ────────────────────────────────────────────────────────
  - type: web
    name: airflow-webserver
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: AIRFLOW__CORE__EXECUTOR
        value: LocalExecutor
      - key: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
        fromDatabase:
          name: postgres-airflow
          property: connectionString
      - key: AIRFLOW__CORE__FERNET_KEY
        sync: false
      - key: AIRFLOW__CORE__LOAD_EXAMPLES
        value: "false"
      - key: AIRFLOW__WEBSERVER__EXPOSE_CONFIG
        value: "false"
      - key: AIRFLOW_CONN_POSTGRES_CPD
        fromDatabase:
          name: postgres-cpd
          property: connectionString
      - key: SOCRATA_APP_TOKEN
        sync: false
      - key: CPD_STAGING_DIR
        value: /opt/airflow/data
      - key: AIRFLOW_ADMIN_USER
        value: admin
      - key: AIRFLOW_ADMIN_PASSWORD
        sync: false
      - key: AIRFLOW__WEBSERVER__SECRET_KEY
        generateValue: true
    dockerCommand: >-
      bash -c "airflow db migrate && airflow users create --username \"$AIRFLOW_ADMIN_USER\" --password \"$AIRFLOW_ADMIN_PASSWORD\" --firstname Admin --lastname User --role Admin --email admin@example.com || true && airflow webserver --port $PORT"

  # ── Airflow scheduler ────────────────────────────────────────────────────────
  - type: worker
    name: airflow-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    dockerCommand: airflow scheduler
    envVars:
      - key: AIRFLOW__CORE__EXECUTOR
        value: LocalExecutor
      - key: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
        fromDatabase:
          name: postgres-airflow
          property: connectionString
      - key: AIRFLOW__CORE__FERNET_KEY
        sync: false
      - key: AIRFLOW__CORE__LOAD_EXAMPLES
        value: "false"
      - key: AIRFLOW_CONN_POSTGRES_CPD
        fromDatabase:
          name: postgres-cpd
          property: connectionString
      - key: SOCRATA_APP_TOKEN
        sync: false
      - key: CPD_STAGING_DIR
        value: /opt/airflow/data

  # ── Metabase ─────────────────────────────────────────────────────────────────
  - type: web
    name: metabase
    runtime: image
    image:
      url: docker.io/metabase/metabase:latest
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: MB_DB_TYPE
        value: postgres
      - key: MB_DB_DBNAME
        value: metabase
      - key: MB_DB_PORT
        value: "5432"
      - key: MB_DB_USER
        fromDatabase:
          name: postgres-metabase
          property: user
      - key: MB_DB_PASS
        fromDatabase:
          name: postgres-metabase
          property: password
      - key: MB_DB_HOST
        fromDatabase:
          name: postgres-metabase
          property: host
