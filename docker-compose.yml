x-airflow-common: &airflow-common
  build: .
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres_airflow/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    # Warehouse connection, available to DAGs as conn_id "postgres_cpd"
    AIRFLOW_CONN_POSTGRES_CPD: postgresql://${CPD_DB_USER}:${CPD_DB_PASSWORD}@postgres_cpd:5432/${CPD_DB_NAME}
    SOCRATA_APP_TOKEN: ${SOCRATA_APP_TOKEN:-}
    CPD_STAGING_DIR: /opt/airflow/data
  volumes:
    - ./dags:/opt/airflow/dags
    - ./sql:/opt/airflow/sql
    - ./data:/opt/airflow/data
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres_airflow:
      condition: service_healthy
    postgres_cpd:
      condition: service_healthy

services:
  # ---- Warehouse: the data we load and visualize ----
  postgres_cpd:
    image: postgres:16
    environment:
      POSTGRES_USER: ${CPD_DB_USER}
      POSTGRES_PASSWORD: ${CPD_DB_PASSWORD}
      POSTGRES_DB: ${CPD_DB_NAME}
    ports: [ "5433:5432" ]
    volumes:
      - cpd_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${CPD_DB_USER} -d ${CPD_DB_NAME}" ]
      interval: 5s
      retries: 10

  # ---- Airflow metadata DB ----
  postgres_airflow:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes: [ airflow_db:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airflow" ]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username "${AIRFLOW_ADMIN_USER}" --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname User --role Admin --email admin@example.com || true
        chown -R 50000:0 /opt/airflow/logs
    user: "0:0"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: [ "8080:8080" ]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 15s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---- Metabase + its own application DB (metadata, NOT our data) ----
  postgres_metabase:
    image: postgres:16
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${MB_DB_PASSWORD}
      POSTGRES_DB: metabase
    volumes: [ metabase_db:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U metabase" ]
      interval: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    ports: [ "3000:3000" ]
    environment:
      JAVA_OPTS: "-Xmx512m"
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${MB_DB_PASSWORD}
      MB_DB_HOST: postgres_metabase
    depends_on:
      postgres_metabase:
        condition: service_healthy
      postgres_cpd:
        condition: service_healthy

volumes:
  cpd_data:
  airflow_db:
  airflow_logs:
  metabase_db:
